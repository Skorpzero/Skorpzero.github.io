<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Задание №7 </title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>

        <div class="wrapper">
            <h1> Галерея изображений </h1>

            <div class="slider">

                    </svg>
                </button>

                <div class="viewport">
                    <ul class="track" id="track">
                        <li class="slide"><img src="https://www.pravmir.ru/wp-content/uploads/2019/12/1024px-bashni_na_skale_u_bosfora_ajvazovskogo.jpg" alt="Изображение 1"></li>
                        <li class="slide"><img src="https://i.pinimg.com/736x/3a/97/fd/3a97fd0c6e926abfaf75afe8561e7729.jpg" alt="Изображение 2"></li>
                        <li class="slide"><img src="https://i.pinimg.com/originals/4d/bf/f0/4dbff04484f285b3bc3ffc9e98fdc1cb.png?nii=t" alt="Изображение 3"></li>
                        <li class="slide"><img src="https://i.pinimg.com/originals/1f/73/84/1f7384b49b7dc8a1d24f090b20f416f0.jpg" alt="Изображение 4"></li>

                        <li class="slide"><img src="https://i.pinimg.com/originals/bc/14/3d/bc143d1b1d97bc740c8953bd72a22fd3.png?nii=t" alt="Изображение 7"></li>
                        <li class="slide"><img src="https://i.pinimg.com/736x/01/db/41/01db4192fae9855e70e6d67d00cdb988.jpg" alt="Изображение 8"></li>
                    </ul>
                </div>

                <button type="button" class="arrow" id="arrow-next" aria-label="Вперёд">
                    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                        <path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
            </div>

            <div class="pager" id="pager"></div>
        </div>

    </body>
</html>
